[workspace]
resolver = "2"
members = [
    "presidio-common",
    "presidio-analyzer",
    "presidio-anonymizer",
    "presidio-image-redactor",
    "presidio-structured",
    "presidio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Presidio Contributors"]
license = "MIT"
repository = "https://github.com/microsoft/presidio"
homepage = "https://microsoft.github.io/presidio/"
rust-version = "1.75"

[workspace.dependencies]
# Core dependencies
presidio-common = { path = "presidio-common" }
presidio-analyzer = { path = "presidio-analyzer" }
presidio-anonymizer = { path = "presidio-anonymizer" }
presidio-image-redactor = { path = "presidio-image-redactor" }
presidio-structured = { path = "presidio-structured" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Regex and pattern matching
regex = "1.11"
fancy-regex = "0.14"

# Async runtime
tokio = { version = "1.41", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
sha2 = "0.10"
aes-gcm = "0.10"

# Validation
phonenumber = "0.3"
iban = "0.1"

# Data processing
polars = { version = "0.44", features = ["lazy", "dtype-full", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Image processing
image = { version = "0.25", features = ["png", "jpeg"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Observability
prometheus = "0.13"
opentelemetry = "0.27"

# URL and network
url = "2.5"
ipnetwork = "0.21"
tldextract = "0.7"

# Utilities
once_cell = "1.20"
lazy_static = "1.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1
